name: DogruTemin Windows CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'hardening/**'
      - 'refactor/**'
      - 'codex/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dogrutemin-ci-v3-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: NuGet paketlerini yükle
        run: |
          dotnet restore DogruTemin.Wpf/DogruTemin.Wpf.csproj
          dotnet restore DogruTemin.Tests/DogruTemin.Tests.csproj
      - name: Bağımlılık güvenlik taraması
        shell: pwsh
        run: |
          $output = dotnet list DogruTemin.Tests/DogruTemin.Tests.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw 'NuGet güvenlik taraması çalıştırılamadı.' }
          if ($output -match 'has the following vulnerable packages') { throw 'Bilinen güvenlik açığı bulunan NuGet paketi tespit edildi.' }
      - name: Release derlemesi yap
        run: dotnet build DogruTemin.Wpf/DogruTemin.Wpf.csproj -c Release --no-restore
      - name: Otomatik testleri ve coverage ölçümünü çalıştır
        run: dotnet test DogruTemin.Tests/DogruTemin.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=DogruTemin.Tests.trx" --collect:"XPlat Code Coverage"
      - name: Test ve coverage raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dogrutemin-test-results
          path: |
            **/DogruTemin.Tests.trx
            **/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

  setup-smoke:
    name: setup-smoke
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inno Setup kur
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Kurulum paketini üret
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'DogruTeminDist'
          .\SETUP_HAZIRLA.ps1 -AllowPrerelease -AllowUnsignedFinal -OutputRoot $dist
          $setup = Get-ChildItem $dist -Filter 'DogruTemin_Setup_*_x64.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Setup EXE bulunamadı.' }
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Real install/update/uninstall acceptance now requires a human to accept the
      # responsibility page. CI must never bypass that consent.
      - name: Kullanıcı kabulü olmadan kurulum ve veri silme reddedilir
        shell: pwsh
        run: |
          $sandbox = Join-Path $env:RUNNER_TEMP 'InstallerConsentCheck'
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          $sentinel = Join-Path $sandbox 'USER_DATA.txt'
          Set-Content -LiteralPath $sentinel 'kullanici-verisi-korunmali' -Encoding utf8
          $before = (Get-FileHash -LiteralPath $sentinel).Hash
          $log = Join-Path $sandbox 'setup.log'
          $args = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + (Join-Path $sandbox 'app') + '"'), ('/LOG="' + $log + '"'))
          $process = Start-Process -FilePath $env:SETUP_PATH -ArgumentList $args -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -eq 0) { throw 'Kurulum kullanıcı kabulünü atladı.' }
          if ((Get-Content -LiteralPath $log -Raw) -notmatch 'InitializeSetup returned False') { throw 'Kurulum beklenen onay kapısında durmadı.' }
          if ((Get-FileHash -LiteralPath $sentinel).Hash -ne $before) { throw 'Kullanıcı verisi değiştirildi.' }
          if (Test-Path -LiteralPath (Join-Path $sandbox 'app')) { throw 'Onaysız program kurulumu yapıldı.' }
      - name: Setup ve SHA-256 paketini sakla
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dogrutemin-setup-smoke
          path: '${{ runner.temp }}/DogruTeminDist/*'
          if-no-files-found: error
          retention-days: 14
